[package]
name = "kolom-lexer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
# Identifiers are normalized to NFC before they are compared — see `ident()`.
unicode-normalization = "0.1"

[dev-dependencies]
# The keyword table must stay NFC; tests/normalization.rs asserts it.
unicode-normalization = "0.1"
